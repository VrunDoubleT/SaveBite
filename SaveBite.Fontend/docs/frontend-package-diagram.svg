<text x="70" y="797" font-family="Arial,sans-serif" font-size="15" fill="#172033">Module contents vary by feature; new features stay inside this package.</text>
<text x="40" y="1180" font-family="Arial,sans-serif" font-size="18" fill="#172033">Dashed line + open arrow: A imports / depends on B. Arrows are not execution order.</text>
<text x="40" y="1220" font-family="Arial,sans-serif" font-size="18" fill="#172033">features is a vertical module boundary: it contains UI, logic, API code and local types.</text>
<text x="40" y="1260" font-family="Arial,sans-serif" font-size="17" fill="#172033">Current dependencies are retained, including shared/stores → features and UI → app/router.</text>
<text x="40" y="1300" font-family="Arial,sans-serif" font-size="17" fill="#172033">Detailed feature packages are available in frontend-package-diagram-detail.puml.</text>
